server.port=5454

#db specific properties
spring.datasource.url=jdbc:mysql://localhost:3306/twitter
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:TwitterClone@2026}

#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OAuth credentials - provide via environment variables, never commit real values
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

# Razorpay credentials - provide via environment variables, never commit real values
razorpay.api.key=${RAZORPAY_API_KEY:your-razorpay-api-key}
razorpay.api.secret=${RAZORPAY_API_SECRET:your-razorpay-api-secret}

